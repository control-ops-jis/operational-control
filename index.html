
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHL Operational Control</title>

<style>
:root{
    --dhl-red:#D40511;
    --dhl-yellow:#FFCC00;
    --bg:#f5f5f5;
}

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:var(--bg);
}

.login-screen,
.access-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card,
.access-card{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.login-card h1,
.access-card h1{
    color:var(--dhl-red);
    text-align:center;
    margin-bottom:25px;
}

.login-card input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-bottom:18px;
    font-size:16px;
}

.login-btn,
.access-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:var(--dhl-red);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:12px;
}

.access-btn.secondary{
    background:#333;
}

.access-btn:hover,
.login-btn:hover{
    opacity:.9;
}

.access-description{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:25px;
    line-height:1.5;
}

.login-error{
    display:none;
    color:var(--dhl-red);
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.app-version{
    position:fixed;
    left:10px;
    bottom:8px;
    font-size:11px;
    color:#777;
    background:rgba(255,255,255,.85);
    padding:4px 8px;
    border-radius:10px;
    z-index:500;
    font-weight:bold;
}

@media(max-width:480px){
    .login-card,
    .access-card{
        padding:25px;
    }
}
</style>
</head>

<body>

<!-- LOGIN ORIGINAL -->

<div class="login-screen" id="loginScreen">
    <div class="login-card">

        <h1>📦 DHL Operational Control</h1>

        <input
            type="text"
            id="employeeId"
            placeholder="Número de empleado"
            inputmode="numeric"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button class="login-btn" onclick="login()">
            Ingresar
        </button>

        <div class="login-error" id="loginError">
            Usuario o contraseña incorrectos
        </div>

    </div>
</div>


<!-- CODPID: SELECTOR DE OPERACIÓN -->

<div
    class="access-screen"
    id="accessScreen"
    style="display:none;"
>
    <div class="access-card">

        <h1>📦 Seleccionar operación</h1>

        <div class="access-description" id="accessDescription">
            Selecciona el módulo al que deseas ingresar.
        </div>

        <div id="accessOptions"></div>

    </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyC4yHubTO4ZPn2H80I1fG7H6qeR7SavNbM",
    authDomain: "dhl-operational-control.firebaseapp.com",
    projectId: "dhl-operational-control",
    storageBucket: "dhl-operational-control.firebasestorage.app",
    messagingSenderId: "830487097530",
    appId: "1:830487097530:web:41e01b4d396678f0819283"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* CODPID: RUTAS DE LOS MÓDULOS */

const CODPID_ROUTES = {
    zl_cod: "codpid-zl.html",
    pu_cod: "codpid-pu.html"
};


/* CODPID: GUARDAR PERFIL SELECCIONADO Y NAVEGAR */

function navigateToCodpid(codpidRole){

    const operationalUser =
        JSON.parse(
            localStorage.getItem("operationalUser") || "{}"
        );

    if(
        !operationalUser.codpidRoles ||
        !operationalUser.codpidRoles.includes(codpidRole)
    ){
        throw new Error("El usuario no tiene autorización para este perfil CodPid.");
    }

    const destination = CODPID_ROUTES[codpidRole];

    if(!destination){
        throw new Error("Ruta CodPid no configurada.");
    }

    operationalUser.selectedCodpidRole = codpidRole;

    localStorage.setItem(
        "operationalUser",
        JSON.stringify(operationalUser)
    );

    window.location.href = destination;
}


/* CODPID: MOSTRAR SELECTOR DE OPERACIÓN */

function showAccessSelector(userData){

    const loginScreen =
        document.getElementById("loginScreen");

    const accessScreen =
        document.getElementById("accessScreen");

    const accessOptions =
        document.getElementById("accessOptions");

    const accessDescription =
        document.getElementById("accessDescription");

    const codpidRoles =
        userData.codpidRoles || [];

    const userRole =
        userData.role || "";

    const isAdmin = [
        "admin",
        "gerente",
        "manager",
        "supervisor",
        "it"
    ].includes(userRole);

    loginScreen.style.display = "none";
    accessScreen.style.display = "flex";

    accessOptions.innerHTML = "";

    accessDescription.innerText =
        "Hola " + (userData.name || userData.employeeId) +
        ". Selecciona el módulo al que deseas ingresar.";

    if(codpidRoles.includes("zl_cod")){

        const buttonZL =
            document.createElement("button");

        buttonZL.className = "access-btn";
        buttonZL.innerText = "Cockpit Transfer";

        buttonZL.addEventListener("click", () => {
            navigateToCodpid("zl_cod");
        });

        accessOptions.appendChild(buttonZL);
    }

    if(codpidRoles.includes("pu_cod")){

        const buttonPU =
            document.createElement("button");

        buttonPU.className = "access-btn";
        buttonPU.innerText = "Cockpit PU";

        buttonPU.addEventListener("click", () => {
            navigateToCodpid("pu_cod");
        });

        accessOptions.appendChild(buttonPU);
    }

    if(isAdmin){

        const buttonAdmin =
            document.createElement("button");

        buttonAdmin.className =
            "access-btn secondary";

        buttonAdmin.innerText =
            "Administración V4";

        buttonAdmin.addEventListener("click", () => {

            userData.selectedCodpidRole = null;

            localStorage.setItem(
                "operationalUser",
                JSON.stringify(userData)
            );

            window.location.href = "dashboard.html";
        });

        accessOptions.appendChild(buttonAdmin);
    }
}


/* LOGIN */

async function login(){

    const employeeId =
        document.getElementById("employeeId").value.trim();

    const password =
        document.getElementById("password").value;

    const loginError =
        document.getElementById("loginError");

    loginError.style.display = "none";

    try{

        const userRef =
            doc(db,"users",employeeId);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()){
            throw new Error("Usuario no existe");
        }

        const userData =
            userSnap.data();

        if(userData.active !== true){
            throw new Error("Usuario inactivo");
        }

        await signInWithEmailAndPassword(
            auth,
            userData.email,
            password
        );


        /* DATOS DEL USUARIO */

        const userRole =
            String(userData.role || "")
                .toLowerCase();

        const userArea =
            String(userData.area || "")
                .toUpperCase();


        /* CODPID: LEER PERFILES ASIGNADOS */

        const allowedCodpidRoles =
            Array.isArray(userData.codpidRoles)
                ? userData.codpidRoles
                    .map(role => String(role).toLowerCase())
                    .filter(role =>
                        role === "zl_cod" ||
                        role === "pu_cod"
                    )
                : [];


        /* GUARDAR INFORMACIÓN DE SESIÓN */

        const operationalUser = {

            employeeId,

            name:
                userData.name ||
                userData.nombre ||
                employeeId,

            role:userRole,

            area:userArea,

            warehouse:userData.warehouse,

            email:userData.email,

            codpidRoles:allowedCodpidRoles,

            codpidGroupId:
                userData.codpidGroupId || null,

            selectedCodpidRole:null
        };

        localStorage.setItem(
            "operationalUser",
            JSON.stringify(operationalUser)
        );


        /* CODPID: DETERMINAR ACCESO */

        const isAdmin = [
            "admin",
            "gerente",
            "manager",
            "supervisor",
            "it"
        ].includes(userRole);


        /*
           Si tiene perfiles CodPid y además es administrador,
           o tiene más de un perfil CodPid,
           mostrar el selector de operaciones.
        */

        if(
            allowedCodpidRoles.length > 0 &&
            (
                isAdmin ||
                allowedCodpidRoles.length > 1
            )
        ){

            showAccessSelector(operationalUser);
            return;
        }


        /*
           Si únicamente tiene un perfil CodPid,
           ingresar directamente a ese módulo.
        */

        if(allowedCodpidRoles.length === 1){

            navigateToCodpid(
                allowedCodpidRoles[0]
            );

            return;
        }


        /* FLUJO ORIGINAL DE CAPTUREFLOW */

        let captureFlow = "containers";

        try{

            const settingsRef =
                doc(db,"systemSettings","captureFlow");

            const settingsSnap =
                await getDoc(settingsRef);

            if(settingsSnap.exists()){

                const settingsData =
                    settingsSnap.data();

                captureFlow =
                    settingsData.activeFlow || "containers";
            }

        }catch(settingsError){

            console.warn(
                "No se pudo leer captureFlow, usando containers por default",
                settingsError
            );

        }


        /* CAPTURISTAS CONVENCIONALES */

        if(
            userRole === "capturista_pu" ||
            userRole === "capturista_zl" ||
            userArea === "PU" ||
            userArea === "ZL"
        ){

            if(captureFlow === "legacy"){

                window.location.href = "capture.html";
                return;
            }

            window.location.href = "containers.html";
            return;
        }


        /* ADMINISTRACIÓN CONVENCIONAL */

        if(isAdmin){

            window.location.href = "dashboard.html";
            return;
        }


        /* RUTA POR DEFECTO ORIGINAL */

        window.location.href = "dashboard.html";


    }catch(error){

        console.error(error);

        loginError.innerText =
            "Usuario o contraseña incorrectos";

        loginError.style.display = "block";
    }

}

window.login = login;

</script>


<div class="app-version" id="appVersion">
    Cargando versión...
</div>

<script src="version.js"></script>

<script>
document.getElementById("appVersion").innerText =
    `${window.APP_CONFIG.name} · ${window.APP_CONFIG.version}`;
</script>

</body>
</html>
